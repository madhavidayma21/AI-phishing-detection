<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body {
    width: 340px;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 16px;
    background: #fafafa;
  }
  h1 {
    font-size: 15px;
    margin: 0 0 12px 0;
    color: #333;
  }
  .url-display {
    font-size: 11px;
    color: #666;
    word-break: break-all;
    margin-bottom: 12px;
    padding: 6px 8px;
    background: #eee;
    border-radius: 4px;
  }
  .verdict-box {
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 12px;
    text-align: center;
  }
  .verdict-box.phishing {
    background: #fce8e6;
    border: 1px solid #d93025;
  }
  .verdict-box.legitimate {
    background: #e6f4ea;
    border: 1px solid #188038;
  }
  .verdict-text {
    font-size: 18px;
    font-weight: 600;
  }
  .verdict-box.phishing .verdict-text { color: #d93025; }
  .verdict-box.legitimate .verdict-text { color: #188038; }
  .confidence {
    font-size: 12px;
    color: #555;
    margin-top: 4px;
  }
  .signals {
    font-size: 12px;
    margin-bottom: 12px;
  }
  .signals ul {
    margin: 4px 0 0 0;
    padding-left: 18px;
  }
  button {
    width: 100%;
    padding: 8px;
    border: none;
    border-radius: 6px;
    background: #1a73e8;
    color: white;
    font-size: 13px;
    cursor: pointer;
  }
  button:disabled {
    background: #ccc;
    cursor: default;
  }
  .explanation {
    margin-top: 12px;
    font-size: 13px;
    line-height: 1.4;
    color: #333;
    padding: 10px;
    background: white;
    border-radius: 6px;
    border: 1px solid #ddd;
  }
  .loading {
    text-align: center;
    color: #888;
    font-size: 12px;
    padding: 20px;
  }
</style>
</head>
<body>
  <h1>AI Phishing Detector</h1>
  <div class="url-display" id="urlDisplay">Loading...</div>
  <div id="content">
    <div class="loading">Checking this page...</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
